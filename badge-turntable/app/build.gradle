plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'org.snurkle.badgeturntable'
    compileSdk 36

    defaultConfig {
        applicationId 'org.snurkle.badgeturntable'
        minSdk 31
        targetSdk 36
        versionCode 2
        versionName '1.0'
    }

    // Release signing: the keystore and its passwords live outside the repo, in the user's
    // ~/.gradle/gradle.properties (BT_RELEASE_STORE_FILE, _STORE_PASSWORD, _KEY_ALIAS,
    // _KEY_PASSWORD). Without them, assembleRelease makes an unsigned APK.
    def releaseSigning = project.hasProperty('BT_RELEASE_STORE_FILE')
    signingConfigs {
        release {
            if (releaseSigning) {
                storeFile file(BT_RELEASE_STORE_FILE)
                storePassword BT_RELEASE_STORE_PASSWORD
                keyAlias BT_RELEASE_KEY_ALIAS
                keyPassword BT_RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation libs.preference
    implementation libs.lifecycle.runtime
    implementation libs.lifecycle.process

    implementation libs.camera.core
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.video
    implementation libs.camera.view

    implementation libs.media3.transformer
    implementation libs.media3.effect
    implementation libs.media3.common

    implementation libs.exifinterface
    implementation libs.opencv

    // The Remote API's WebRTC transport: the Go bridge in ../webrtc-bridge, built with gomobile
    // (see its README). Optional: without it the app runs with plain HTTP only.
    implementation fileTree(dir: 'libs', include: ['*.aar'])

    // IR learning over a USB IR receiver (phase 7); also uncomment jitpack in settings.gradle
    // implementation 'com.github.mik3y:usb-serial-for-android:3.8.0'

    testImplementation libs.junit
    testImplementation libs.json  // real org.json for JVM tests (Android's is a stub)
}
